site_name: Catus
site_description: 하루 끝에 고양이 달이와 나눈 대화가 그날 밤 그림일기로 도착하는, 고립 전 20대를 위한 감정 기록 서비스. 기획, 설계, 운영 기록
site_url: https://freaks0.github.io/catus/
use_directory_urls: false
copyright: Copyright &copy; 2026 손병훈

theme:
  name: material
  custom_dir: overrides
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    logo: material/cat
  favicon: design/dali-final.png
  features:
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy

nav:
  - 소개: index.md
  - 기획과 리서치: 01-planning.md
  - 디자인: 07-design.md
  - 설계: 03-architecture.md
  - 운영과 회고: 04-troubleshooting.md

plugins:
  - social:
      cards_layout_options:
        font_family: Noto Sans KR
        background_color: "#00897b"
        color: "#ffffff"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/web
      link: https://catus-app.vercel.app
      name: Live Demo
    - icon: fontawesome/brands/github
      link: https://github.com/freaks0
